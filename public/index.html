<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaCRM — Lead & Messaging Hub for Facebook & Instagram</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236366F1'/%3E%3Cstop offset='100%25' stop-color='%234F46E5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M8 16c0-3.3 2.5-5.8 5.8-5.8 2.2 0 4 1.2 5 3l-2.2 1.3c-.7-1.1-1.6-1.7-2.8-1.7-1.9 0-3.3 1.4-3.3 3.2s1.4 3.2 3.3 3.2c1.2 0 2.1-.6 2.8-1.7l2.2 1.3c-1 1.8-2.8 3-5 3C10.5 21.8 8 19.3 8 16z' fill='%23ffffff'/%3E%3Ccircle cx='23' cy='16' r='3.2' fill='%2310B981'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Fullscreen Dedicated Authentication View (Login / Signup / Reset) -->
  <div id="auth-container" class="auth-screen" style="display: none;"></div>

  <div id="app-layout">
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <a href="#dashboard" class="app-brand-badge">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="url(#brand-grad)" />
            <path d="M8 16c0-3.3 2.5-5.8 5.8-5.8 2.2 0 4 1.2 5 3l-2.2 1.3c-.7-1.1-1.6-1.7-2.8-1.7-1.9 0-3.3 1.4-3.3 3.2s1.4 3.2 3.3 3.2c1.2 0 2.1-.6 2.8-1.7l2.2 1.3c-1 1.8-2.8 3-5 3C10.5 21.8 8 19.3 8 16z" fill="#fff" />
            <circle cx="23" cy="16" r="3.2" fill="#10B981" />
            <defs>
              <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366F1" />
                <stop offset="100%" stop-color="#4338CA" />
              </linearGradient>
            </defs>
          </svg>
          <span class="nav-text brand-title">MetaCRM</span>
        </a>
        <button id="close-sidebar-btn" class="close-sidebar-btn" aria-label="Close navigation">✕</button>
      </div>
      <div class="nav-section" id="sidebar-nav">
        <!-- Injected via JS -->
      </div>
    </aside>

    <!-- Main -->
    <main id="main-area">
      <div class="topbar">
        <button id="mobile-menu-btn" class="mobile-toggle-btn" aria-label="Open navigation">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <h1 class="topbar-title" id="page-title">Dashboard</h1>
        <div class="topbar-actions" id="topbar-actions">
          <!-- Injected via JS -->
        </div>
        <!-- Phase A: Notifications Bell & Popover -->
        <div class="notif-bell-container" id="notif-bell-container">
          <button class="notif-bell-btn" id="notif-bell-btn" aria-label="Notifications" title="Notifications">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notif-badge" id="notif-unread-badge" style="display: none;">0</span>
          </button>
          <div class="notif-popover" id="notif-popover">
            <div class="notif-popover-header">
              <span class="font-semibold text-sm">Notifications</span>
              <button class="link-small btn btn-ghost btn-sm" id="notif-mark-all-btn">Mark all read</button>
            </div>
            <div class="notif-list" id="notif-list">
              <!-- Injected via JS -->
            </div>
          </div>
        </div>
      </div>
      <div class="content-wrapper" id="main-content">
        <!-- Dynamic Content -->
      </div>
    </main>
  </div>

  <!-- Slide-over Drawer -->
  <div id="drawer-overlay"></div>
  <div id="drawer">
    <div class="drawer-header">
      <div class="font-semibold" id="drawer-title">Details</div>
      <button class="btn btn-ghost btn-sm" id="close-drawer">✕</button>
    </div>
    <div class="drawer-content" id="drawer-content">
      <!-- Injected via JS -->
    </div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div id="modal-title">Modal</div>
        <button class="btn btn-ghost btn-sm" id="close-modal">✕</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Injected -->
      </div>
      <div class="modal-footer" id="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <script src="js/supabase-client.js"></script>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/crm-service.js"></script>
  <script src="js/meta-service.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
