[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# --- Meta OAuth Endpoints ---
[[redirects]]
  from = "/api/meta/oauth"
  to = "/.netlify/functions/meta-oauth"
  status = 200

[[redirects]]
  from = "/api/meta/callback"
  to = "/.netlify/functions/meta-callback"
  status = 200

[[redirects]]
  from = "/api/auth/meta/url"
  to = "/.netlify/functions/meta-oauth"
  status = 200

[[redirects]]
  from = "/api/auth/meta/callback"
  to = "/.netlify/functions/meta-callback"
  status = 200

# --- Zernio Meta Gateway Endpoints ---
[[redirects]]
  from = "/api/zernio/status"
  to = "/.netlify/functions/zernio-status"
  status = 200

[[redirects]]
  from = "/api/zernio/connect/facebook"
  to = "/.netlify/functions/zernio-connect?channel=facebook"
  status = 200

[[redirects]]
  from = "/api/zernio/connect/ads"
  to = "/.netlify/functions/zernio-connect?channel=ads"
  status = 200

[[redirects]]
  from = "/api/zernio/connect/instagram"
  to = "/.netlify/functions/zernio-connect?channel=instagram"
  status = 200

[[redirects]]
  from = "/api/zernio/simulate-lead"
  to = "/.netlify/functions/zernio-simulate"
  status = 200

# --- Webhook Receivers ---
[[redirects]]
  from = "/api/webhooks/zernio"
  to = "/.netlify/functions/meta-webhook"
  status = 200

[[redirects]]
  from = "/api/webhooks/meta"
  to = "/.netlify/functions/meta-webhook"
  status = 200

# --- Core CRM REST APIs ---
[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/api/leads/*"
  to = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/api/conversations"
  to = "/.netlify/functions/messages"
  status = 200

[[redirects]]
  from = "/api/conversations/*"
  to = "/.netlify/functions/messages"
  status = 200

[[redirects]]
  from = "/api/messages"
  to = "/.netlify/functions/messages"
  status = 200

[[redirects]]
  from = "/api/messages/*"
  to = "/.netlify/functions/messages"
  status = 200

[[redirects]]
  from = "/api/pages"
  to = "/.netlify/functions/pages"
  status = 200

[[redirects]]
  from = "/api/campaigns"
  to = "/.netlify/functions/campaigns"
  status = 200

[[redirects]]
  from = "/api/staff"
  to = "/.netlify/functions/staff"
  status = 200

[[redirects]]
  from = "/api/reports"
  to = "/.netlify/functions/reports"
  status = 200

# --- Single Page Application (SPA) Catch-all ---
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Production Security Headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
