<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaCRM — Lead & Messaging Hub for Facebook & Instagram</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23202223'/%3E%3Cpath d='M8 23V9h3.6l4.4 7.2L20.4 9H24v14h-3.2v-8.8l-4.1 6.6h-1.4l-4.1-6.6V23H8z' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20261015-v5">
</head>
<body>

  <!-- Fullscreen Dedicated Authentication View (Login / Signup / Reset) -->
  <div id="auth-container" class="auth-screen" style="display: none;"></div>

  <div id="app-layout">
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <a href="#dashboard" class="app-brand-badge">
          <div class="brand-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5c-2.48 0-4.5-2.02-4.5-4.5S8.52 7.5 11 7.5c1.42 0 2.68.66 3.5 1.69.82-1.03 2.08-1.69 3.5-1.69 2.48 0 4.5 2.02 4.5 4.5s-2.02 4.5-4.5 4.5c-1.42 0-2.68-.66-3.5-1.69-.82 1.03-2.08 1.69-3.5 1.69z" fill="#FF6A00" opacity="0.18"/>
              <path d="M16.5 9c-1.66 0-3 1.34-3 3 0 .74.27 1.42.72 1.95L12 16.14l-2.22-2.19c.45-.53.72-1.21.72-1.95 0-1.66-1.34-3-3-3s-3 1.34-3 3 1.34 3 3 3c.74 0 1.42-.27 1.95-.72L12 16.86l2.55-2.58c.53.45 1.21.72 1.95.72 1.66 0 3-1.34 3-3s-1.34-3-3-3zm-9 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" fill="#FF6A00"/>
            </svg>
          </div>
          <span class="nav-text brand-title">MetaCRM</span>
        </a>
        <div class="sidebar-header-actions">
          <button id="sidebar-collapse-btn" class="sidebar-collapse-btn" aria-label="Collapse sidebar" title="Collapse sidebar">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M9 3v18"/>
              <path d="m14 9-3 3 3 3"/>
            </svg>
          </button>
          <button id="close-sidebar-btn" class="close-sidebar-btn" aria-label="Close navigation">✕</button>
        </div>
      </div>
      <div class="nav-section" id="sidebar-nav">
        <!-- Injected via JS -->
      </div>
    </aside>

    <!-- Main -->
    <main id="main-area">
      <div class="topbar">
        <button id="mobile-menu-btn" class="mobile-toggle-btn" aria-label="Open navigation">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="topbar-title-wrap" id="page-title">
          <h1 class="topbar-title">Dashboard</h1>
        </div>
        
        <!-- Global Search Bar -->
        <div class="topbar-search-wrap" id="topbar-search-wrap">
          <svg class="topbar-search-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="topbar-search-input" id="global-search-input" placeholder="Search conversations, leads, or anything..." oninput="window.app.handleGlobalSearch(this.value)" autocomplete="off">
          <kbd class="topbar-search-kbd">⌘ K</kbd>
        </div>

        <div class="topbar-actions" id="topbar-actions">
          <!-- Injected via JS -->
        </div>

        <!-- Phase A: Notifications Bell & Popover -->
        <div class="notif-bell-container" id="notif-bell-container">
          <button class="notif-bell-btn" id="notif-bell-btn" aria-label="Notifications" title="Notifications">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notif-badge" id="notif-unread-badge" style="display: none;">0</span>
          </button>
          <div class="notif-popover" id="notif-popover">
            <div class="notif-popover-header">
              <span class="font-semibold text-sm">Notifications</span>
              <button class="link-small btn btn-ghost btn-sm" id="notif-mark-all-btn">Mark all read</button>
            </div>
            <div class="notif-list" id="notif-list">
              <!-- Injected via JS -->
            </div>
          </div>
        </div>

        <!-- Currency Selector Indicator -->
        <div class="topbar-currency-wrap">
          <select id="topbar-currency-select" class="topbar-currency-select" onchange="window.app.setCurrency(this.value)" title="Change CRM Display Currency">
            <option value="USD" selected>$ USD</option>
            <option value="INR">₹ INR</option>
            <option value="NZD">$ NZD</option>
          </select>
        </div>

        <!-- User Profile Avatar -->
        <div class="topbar-avatar" id="topbar-avatar" onclick="window.app.openUserProfileModal()" title="User Profile">JD</div>
      </div>
      <div class="content-wrapper" id="main-content">
        <!-- Dynamic Content -->
      </div>
    </main>
  </div>

  <!-- Slide-over Drawer -->
  <div id="drawer-overlay"></div>
  <div id="drawer">
    <div class="drawer-header">
      <div class="font-semibold" id="drawer-title">Details</div>
      <button class="btn btn-ghost btn-sm" id="close-drawer">✕</button>
    </div>
    <div class="drawer-content" id="drawer-content">
      <!-- Injected via JS -->
    </div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div id="modal-title">Modal</div>
        <button class="btn btn-ghost btn-sm" id="close-modal">✕</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Injected -->
      </div>
      <div class="modal-footer" id="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase-client.js?v=20261015-v5"></script>

  <!-- Scripts -->
  <script src="js/data.js?v=20261015-v5"></script>
  <script src="js/crm-service.js?v=20261015-v5"></script>
  <script src="js/meta-service.js?v=20261015-v5"></script>
  <script src="js/app.js?v=20261015-v5"></script>
</body>
</html>
